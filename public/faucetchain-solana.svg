<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512"
     role="img" aria-label="FaucetChain settling on Solana">
  <title>FaucetChain on Solana</title>
  <defs>
    <!-- FaucetChain: the drop -->
    <linearGradient id="fcDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0055CC"/>
    </linearGradient>

    <!-- Solana: one gradient across all three bars, not one per bar -->
    <linearGradient id="solGrad" gradientUnits="userSpaceOnUse" x1="0" y1="312" x2="398" y2="0">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="20%" stop-color="#8752F3"/>
      <stop offset="40%" stop-color="#5497D5"/>
      <stop offset="60%" stop-color="#43B4CA"/>
      <stop offset="80%" stop-color="#28E0B9"/>
      <stop offset="100%" stop-color="#19FB9B"/>
    </linearGradient>

    <path id="dropPath"
          d="M50 8 C50 8 18 42 18 64 C18 81.67 32.33 96 50 96 C67.67 96 82 81.67 82 64 C82 42 50 8 50 8 Z"/>

    <!-- a pure halo: the crisp drop is drawn on top of it -->
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <use href="#dropPath" fill="#00C2FF" filter="url(#halo)" opacity="0.55"/>
  <use href="#dropPath" fill="url(#fcDrop)"/>

  <!-- The Solana mark sits inside the drop, ringed so it reads as inset -->
  <g transform="translate(28 48.75) scale(0.1106)"
     fill="url(#solGrad)" stroke="#0b101a" stroke-width="18"
     stroke-linejoin="round" paint-order="stroke">
    <path d="M64.6 237.9c2.4-2.4 5.7-3.8 9.2-3.8h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1l62.7-62.7z"/>
    <path d="M64.6 3.8C67.1 1.4 70.4 0 73.8 0h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1L64.6 3.8z"/>
    <path d="M333.1 120.1c-2.4-2.4-5.7-3.8-9.2-3.8H6.5c-5.8 0-8.7 7-4.6 11.1l62.7 62.7c2.4 2.4 5.7 3.8 9.2 3.8h317.4c5.8 0 8.7-7 4.6-11.1l-62.7-62.7z"/>
  </g>
</svg>

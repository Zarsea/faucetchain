
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaucetChain | Hybrid Consensus Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-bg': '#05050A',
            'brand-surface': '#0D0E15',
            'brand-card': '#141622',
            'brand-border': '#222538',
            'brand-primary': '#00F0FF',
            'brand-secondary': '#E2E8F0',
            'brand-muted': '#64748B',
            'brand-accent': '#FF003C',
            'brand-success': '#00FF66',
            'brand-error': '#FF003C',
            'neon-cyan': '#00F0FF',
            'neon-purple': '#8A2BE2',
            'neon-pink': '#FF00FF'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['Fira Code', 'monospace']
          },
          boxShadow: {
            'glow-primary': '0 0 20px -5px rgba(0, 240, 255, 0.6)',
            'glow-accent': '0 0 20px -5px rgba(255, 0, 60, 0.6)',
            'glow-purple': '0 0 20px -5px rgba(138, 43, 226, 0.6)',
            'glow-success': '0 0 20px -5px rgba(0, 255, 102, 0.6)',
            'neon': '0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3)',
            'neon-purple': '0 0 10px rgba(138, 43, 226, 0.5), 0 0 20px rgba(138, 43, 226, 0.3)'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', filter: 'blur(8px)' },
              '50%': { opacity: '0.8', filter: 'blur(12px)' }
            },
            liquidFlow: {
              '0%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
              '100%': { backgroundPosition: '0% 50%' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' }
            },
            neonFlicker: {
              '0%, 19%, 21%, 23%, 25%, 54%, 56%, 100%': { opacity: '1', filter: 'drop-shadow(0 0 8px rgba(0,240,255,0.8))' },
              '20%, 24%, 55%': { opacity: '0.4', filter: 'none' }
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.5s ease-out',
            slideUp: 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
            pulseGlow: 'pulseGlow 3s infinite',
            liquidFlow: 'liquidFlow 8s ease infinite',
            float: 'float 6s ease-in-out infinite',
            neonFlicker: 'neonFlicker 4s infinite alternate'
          }
        }
      }
    };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        scrollbar-width: thin;
        scrollbar-color: #334155 transparent;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
      .glass {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .neon-border {
        position: relative;
      }
      .neon-border::after {
        content: '';
        position: absolute;
        inset: -1px;
        background: linear-gradient(45deg, #38bdf8, #818cf8, transparent);
        z-index: -1;
        border-radius: inherit;
        opacity: 0.3;
        transition: opacity 0.3s;
      }
      .neon-border:hover::after {
        opacity: 0.6;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-brand-bg text-brand-secondary selection:bg-brand-primary/30">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>

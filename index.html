
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaucetChain | Hybrid Consensus Explorer</title>
    <!-- The small mark: the full one carries Solana's three bars, which cannot
         survive a 16px tab. -->
    <link rel="icon" type="image/svg+xml" href="/faucetchain-mark-small.svg" />
    <!-- 192 em vez da de 1024: o iOS reduz a imagem de qualquer jeito, e a de
         1024 custa 240 KB no primeiro acesso para virar um icone de 60px. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Instalavel no celular. A barra do sistema recebe o fundo da marca; sem
         isto o Android pinta branco em volta de uma interface escura. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070F16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FaucetChain" />
    <!-- "black" e nao "black-translucent": translucido joga o conteudo por
         baixo do relogio do iPhone, e esta tela tem cabecalho no topo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Amostradas de public/logo.png (15/06) — que é uma captura da
            // interface antiga, não a logo: é o registro que sobrou da
            // identidade azul. #0078CF domina, com #0668AA e #539DD4 ao lado.
            // O contraste de cada uma contra o fundo foi medido, não escolhido
            // no olho.
            'brand-bg': '#070F16',
            'brand-surface': '#0C1620',
            'brand-card': '#111E2A',
            'brand-border': '#1C2E3D',
            // 6.64:1 — passa em texto. A identidade clareada para interface.
            'brand-primary': '#2B9FE8',
            // 4.21:1 — o azul da marca, exato. Preenchimento e momentos de marca,
            // nunca texto pequeno.
            'brand-deep': '#0078CF',
            'brand-mid': '#539DD4',
            'brand-secondary': '#D6E0F6',
            'brand-muted': '#6B8299',
            'brand-accent': '#2B9FE8',
            'brand-success': '#14B87A',
            // Erro é sinal, não sotaque da marca. Vermelho sóbrio, não neon.
            'brand-error': '#E5484D',
            'brand-warn': '#D9A441',
            // Solana's own colours. Used only where value settles on Solana, so
            // the palette carries the architecture: cyan distributes, this pays.
            'sol-purple': '#9945FF',
            'sol-green': '#14F195',
            'sol-mid': '#5497D5'
          },
          fontFamily: {
            // A fonte que a pagina desenha, nao outra. O index.css ja punha
            // body e h1-h6 em Outfit e .font-mono em JetBrains Mono, e carrega
            // depois daqui -- entao o Archivo declarado antes nunca apareceu,
            // so era baixado. Outfit ja e distintiva; a troca tentava fugir da
            // Inter, que esta pagina nunca usou.
            sans: ['Outfit', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          },
          // Elevação no lugar de brilho. Brilho faz tudo flutuar no mesmo
          // plano e envelheceu; sombra com direção diz o que está acima do quê,
          // que é o que separa hierarquia de enfeite.
          boxShadow: {
            'lift-sm': '0 1px 2px rgba(0,0,0,0.4), 0 2px 8px -2px rgba(0,0,0,0.3)',
            'lift': '0 2px 4px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.45)',
            'lift-lg': '0 4px 8px rgba(0,0,0,0.45), 0 20px 48px -12px rgba(0,0,0,0.55)',
            // Um único halo, reservado ao momento de marca. Não para cartões.
            'glow-primary': '0 0 32px -8px rgba(43, 159, 232, 0.55)',
            'glow-settle': '0 0 32px -8px rgba(153, 69, 255, 0.45)'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', filter: 'blur(8px)' },
              '50%': { opacity: '0.8', filter: 'blur(12px)' }
            },
            liquidFlow: {
              '0%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
              '100%': { backgroundPosition: '0% 50%' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' }
            },
            // O piscar de neon saiu: é ruído, e prejudica quem tem sensibilidade
            // a movimento. No lugar, uma respiração lenta do halo da marca.
            brandBreathe: {
              '0%, 100%': { opacity: '0.55' },
              '50%': { opacity: '0.9' }
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.5s ease-out',
            slideUp: 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
            pulseGlow: 'pulseGlow 3s infinite',
            liquidFlow: 'liquidFlow 8s ease infinite',
            float: 'float 6s ease-in-out infinite',
            brandBreathe: 'brandBreathe 4s ease-in-out infinite'
          }
        }
      }
    };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- As fontes vem do @import no topo do index.css, numa requisicao so.
         Os preconnect acima continuam valendo para ela. -->
    <style>
      body {
        scrollbar-width: thin;
        scrollbar-color: #1C2E3D transparent;
      }

      /* As partes que o navegador desenha também carregam o design. São as
         primeiras a denunciar uma interface montada em vez de construída, e as
         que quase ninguém tematiza. */
      ::selection {
        background: rgba(43, 159, 232, 0.28);
        color: #EAF2FF;
      }
      input, textarea {
        caret-color: #2B9FE8;
      }
      :focus-visible {
        outline: 2px solid #2B9FE8;
        outline-offset: 2px;
        border-radius: 4px;
      }
      /* Dígito de largura fixa onde números se empilham: sem isso a coluna
         dança a cada atualização, e este produto atualiza em tempo real. */
      .tabular, table td, table th {
        font-variant-numeric: tabular-nums;
      }

      /* Um movimento, não um efeito por seção: a entrada é a mesma curva em
         todo lugar, exponencial a partir de um estado já visível, para que
         nada chegue invisível se o script falhar. */
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
      }
      .rise {
        animation: rise 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .rise-2 { animation-delay: 60ms; }
      .rise-3 { animation-delay: 120ms; }
      .rise-4 { animation-delay: 180ms; }

      @media (prefers-reduced-motion: reduce) {
        .rise, .rise-2, .rise-3, .rise-4 {
          animation: none;
        }
      }
      /* A barra de rolagem e do index.css, que tambem trata o hover. */
      .glass {
        /* Derivado do fundo, não do slate genérico do Tailwind. */
        background: rgba(12, 22, 32, 0.72);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        border-bottom: 1px solid rgba(43, 159, 232, 0.10);
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-brand-bg text-brand-secondary selection:bg-brand-primary/30">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
<script>
  // Registro depois do load, de proposito: o service worker nao e o que o
  // usuario esta esperando ver, e baixa-lo junto com o primeiro paint atrasa
  // exatamente a tela que ele existe para acelerar.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>

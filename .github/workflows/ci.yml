name: CI

on:
  push:
    branches: [main, "hackathon/**"]
  pull_request:

jobs:
  backend:
    name: Sequencer and settlement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reward batches match the tree the program verifies
        run: python settlement.py

      - name: Every invariant catches the defect it was written for
        run: python reconcile.py --self-check

      - name: Settlement API
        run: python tests/test_settlement_api.py

      - name: Sequencer security checks
        run: python tests/test_security_fixes.py

      - name: No route changes state without a reason to trust its caller
        run: python test_endpoint_inventory.py

      - name: The four repaired gates are still shut
        run: python test_authorization.py

      - name: A forged platform sign-in reaches nothing
        run: |
          python social_auth.py
          python test_social_login.py

      - name: A FaucetPay account is named before it is proved
        run: python test_faucetpay_identity.py

      - name: The documents name routes this server serves
        run: python test_docs_match_code.py

      - name: The partner's bridge still finds the fields it reads
        run: python test_bridge_contract.py

      - name: No staker can buy the block
        run: python test_sealer_cap.py

      - name: The balance screen never offers a withdrawal that already happened
        run: python tests/test_holdings_collected.py

      - name: The browser and the server build the same signed sentences
        run: |
          npm ci
          python scripts/check_messages.py

      - name: Nothing asks the wallet to sign before it has connected
        run: node test_connected_signer.mjs

      - name: No page navigation reaches a route that needs a header
        run: python test_header_auth_reachable.py

      - name: A storage wrapper calls the storage it wraps
        run: node test_storage_helpers.mjs

      - name: The ledger never denies a withdrawal the chain reports
        run: node test_ledger_contradiction.mjs

      - name: Every diagram parses, and no language without one breaks the page
        run: node test_diagrams_parse.mjs

  program:
    name: Solana program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Solana and Rust toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-toolchain-agave4.2.2-anchor1.2.0

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            faucetchain/target
          key: program-build-${{ hashFiles('faucetchain/Cargo.lock') }}
          restore-keys: program-build-

      - name: Install the toolchain
        run: bash scripts/setup-solana-toolchain.sh

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          bash scripts/build-program.sh

      - name: Merkle and the end-to-end flow on LiteSVM
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd faucetchain && cargo test -p faucetchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instruction encoders still match the IDL
        run: |
          pip install solders requests
          python solana_settlement.py
